version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: tsui_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  bot:
    build: .
    container_name: tsui_cyberpunk_bot
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - .:/app
    depends_on:
      - redis

volumes:
  redis_data:
