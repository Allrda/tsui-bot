<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Cyberpunk Admin Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: var(--bg-panel); padding: 40px; border: 2px solid var(--neon-pink); box-shadow: 0 0 25px var(--neon-pink); width: 340px; text-align: center; clip-path: var(--cut-corner); }
        h2 { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }
        input { margin: 12px 0; }
        .error { color: var(--neon-red); margin-top: 15px; font-size: 13px; }
        .footer-brand { margin-top: 20px; font-size: 12px; color: var(--text-muted); }
        .discord-btn { display: block; width: 100%; margin-top: 15px; background: #5865F2; color: white; border: none; padding: 10px; font-family: monospace; font-weight: bold; text-decoration: none; box-shadow: 0 0 10px #5865F2; }
        .discord-btn:hover { background: #4752C4; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>[SYSTEM] // AUTH</h2>
        <form method="POST" action="/admin/login">
            <input type="text" name="username" placeholder="Operator ID" required>
            <input type="password" name="password" placeholder="Passcode" required>
            <button type="submit" style="width:100%;">Initialize Session</button>
        </form>
        <a href="/admin/auth/discord" class="discord-btn">🎮 Discord ile Giriş Yap</a>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </div>
    <div class="footer-brand">
        <span style="color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); font-weight: bold;">MADE IN devpact</span>
    </div>
</body>
</html>
