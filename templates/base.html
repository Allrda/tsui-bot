<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Cyberpunk Admin Panel{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <h1>[TSUİ] // BOT MANAGEMENT</h1>
            <span class="badge badge-cyan" style="font-size: 11px; padding: 4px 10px; box-shadow: 0 0 10px var(--neon-cyan); letter-spacing: 1px;">MADE BY devpact</span>
        </div>
        <div class="nav-links">
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/implants">Hardware Catalog</a>
            <a href="/admin/market">Store Catalog</a>
            <a href="/admin/lore">Chronology</a>
            <a href="/admin/channels">Channels</a>
            <a href="/admin/logs">Live Logs</a>
            <a href="/admin/logout" style="border-color: var(--neon-red); color: var(--neon-red);">Disconnect</a>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer style="margin-top: 40px; padding: 20px 0; border-top: 1px dashed var(--border-color); text-align: center; font-size: 12px; color: var(--text-muted);">
        <span style="color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); font-weight: bold;">MADE BY devpact</span> // ALL RIGHTS RESERVED
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
